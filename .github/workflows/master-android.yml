name: OpenHiggsfield - Master Android Release

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Playwright QA Agent - End-to-End"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: openhiggsfield-master-release
  cancel-in-progress: true

jobs:
  release-gate:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/story-studio/package-lock.json
      - name: Build production web studio
        run: |
          npm ci
          npm ci --prefix apps/story-studio
          npm run build
          test -s apps/story-studio/dist/index.html
          mkdir -p android/app/src/main/assets
          cp -a apps/story-studio/dist/. android/app/src/main/assets/
          test -s android/app/src/main/assets/index.html
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: latest
          packages: platform-tools
      - name: Install Android SDK
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.6'
      - name: Build Android APK
        working-directory: android
        run: gradle --no-daemon --stacktrace testDebugUnitTest lint assembleDebug
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: openhiggsfield-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Check signing secrets
        id: signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE" ] && [ -n "$STORE_PASS" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASS" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Signing secrets missing; debug APK only."
          fi
      - name: Decode keystore
        if: steps.signing.outputs.configured == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/openhiggsfield.jks"
          keytool -list -keystore "$RUNNER_TEMP/openhiggsfield.jks" -storepass "$STORE_PASS" -alias "$KEY_ALIAS" >/dev/null
      - name: Build signed release APK
        if: steps.signing.outputs.configured == 'true'
        working-directory: android
        env:
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle --no-daemon --stacktrace \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/openhiggsfield.jks" \
            -Pandroid.injected.signing.store.password="$STORE_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS" assembleRelease
      - name: Upload signed APK
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: openhiggsfield-signed-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Summarize
        if: always()
        run: |
          {
            echo "## OpenHiggsfield Android"
            echo "- Debug APK: built and uploaded when this job succeeds."
            echo "- Signed release APK: ${{ steps.signing.outputs.configured == 'true' && 'built' || 'not built - signing secrets required' }}"
            echo "- The Android package includes the built Story Studio UI. Live generation requires the backend and GPU/provider service to be deployed and configured."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/openhiggsfield.jks"
