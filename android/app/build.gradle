plugins {
    id 'com.android.application'
}
android {
    namespace 'com.sshacker18.openhiggsfield'
    compileSdk 36
    defaultConfig {
        applicationId 'com.sshacker18.openhiggsfield'
        minSdk 26
        targetSdk 35
        versionCode (project.findProperty('VERSION_CODE') ?: '1').toInteger()
        versionName '0.1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        upload {
            def keystorePath = project.findProperty('android.injected.signing.store.file')
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword project.findProperty('android.injected.signing.store.password')
                keyAlias project.findProperty('android.injected.signing.key.alias')
                keyPassword project.findProperty('android.injected.signing.key.password')
            }
        }
    }
    buildTypes {
        debug { applicationIdSuffix '.debug'; versionNameSuffix '-debug' }
        release {
            minifyEnabled false
            if (project.findProperty('android.injected.signing.store.file')) signingConfig signingConfigs.upload
        }
    }
    lint { abortOnError true }
}
