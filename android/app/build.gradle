plugins {
    id 'com.android.application'
}

def configuredVersionCode = providers.gradleProperty('VERSION_CODE').getOrElse('1').toInteger()
def signingStoreFile = providers.gradleProperty('android.injected.signing.store.file').orNull
def signingStorePassword = providers.gradleProperty('android.injected.signing.store.password').orNull
def signingKeyAlias = providers.gradleProperty('android.injected.signing.key.alias').orNull
def signingKeyPassword = providers.gradleProperty('android.injected.signing.key.password').orNull

android {
    namespace 'com.sshacker18.openhiggsfield'
    compileSdk 36
    externalNativeBuild {
        cmake { path "src/main/cpp/CMakeLists.txt"; version "3.22.1" }
    }
    defaultConfig {
        applicationId 'com.sshacker18.openhiggsfield'
        minSdk 26
        targetSdk 35
        versionCode configuredVersionCode
        versionName '0.1.0'
        externalNativeBuild { cmake { cppFlags "-std=c++17" } }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        upload {
            if (signingStoreFile) {
                storeFile file(signingStoreFile)
                storePassword signingStorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
            }
        }
    }
    buildTypes {
        debug { applicationIdSuffix '.debug'; versionNameSuffix '-debug' }
        release {
            minifyEnabled false
            if (signingStoreFile) signingConfig signingConfigs.upload
        }
    }
    lint { abortOnError true }
}
